[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracemiku"
version = "0.3.0"
description = "ARM64 JNI trace pipeline (Frida agent + Rust analysis server + Solid Web UI) for Android RE/security research."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ltlly" }]
license = { text = "MIT" }
keywords = ["android", "frida", "arm64", "trace", "jni", "reverse-engineering"]

# Hard runtime deps. Versions pinned to the working set on the dev machine
# (Ubuntu 26.04 + Python 3.11). Bump deliberately, not opportunistically.
dependencies = [
    "capstone>=5.0,<6",
    "frida>=17.0,<18",
]

[project.optional-dependencies]
test = []
decomp = []
dev = ["tracemiku[test]"]

[tool.ruff]
# 目标知识/历史遗留排除：examples 是目标配置边界（AGENTS），arm64_test_bins 是
# 历史测试脚本，tracemiku 主文件为存量单行风格（E701/E702 100+ 处，拆分重构时清理，
# 不混入功能提交）。新增代码仍强制 lint；存量清理走独立重构。
extend-exclude = [
    "examples",
    "tests/arm64_test_bins",
    "tracemiku",
]

[project.urls]
Homepage = "https://github.com/ltlly/traceMiku"

[tool.setuptools]
# This Python project is dependency/runtime glue for the top-level wrapper.
# Runtime analysis and the web UI live in Rust crates plus frontend/.
py-modules = []

# pytest config lives in pytest.ini (pytest reads that first; pyproject.toml
# duplication would be ignored).
