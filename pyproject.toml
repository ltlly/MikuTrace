[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracemiku"
version = "0.3.0"
description = "ARM64 JNI trace pipeline (Frida agent + Rust analysis server + Solid Web UI) for Android RE/security research."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ltlly" }]
license = { text = "MIT" }
keywords = ["android", "frida", "arm64", "trace", "jni", "reverse-engineering"]

# Hard runtime deps. Versions pinned to the working set on the dev machine
# (Ubuntu 26.04 + Python 3.11). Bump deliberately, not opportunistically.
dependencies = [
    "capstone>=5.0,<6",
    "frida>=17.0,<18",
]

[project.optional-dependencies]
# 仓库自带检查工具的依赖（make lint / host pytest / make smoke-ui）。
# ruff 锁 minor 版本：lint 规则集跟随 ruff 默认 select，跨 minor 升级可能
# 改变判定结果，升级需 deliberate 并修复新告警。
test = [
    "playwright>=1.40",
    "pytest>=8",
    "ruff>=0.16,<0.17",
]
dev = ["tracemiku[test]"]

[tool.ruff]
# 目标知识/历史遗留排除：examples 是目标配置边界（AGENTS），arm64_test_bins 是
# 历史测试脚本，tracemiku 主文件为存量单行风格（E701/E702 100+ 处，拆分重构时清理，
# 不混入功能提交）。新增代码仍强制 lint；存量清理走独立重构。
extend-exclude = [
    "examples",
    "tests/arm64_test_bins",
    "tracemiku",
]

[tool.ruff.lint.per-file-ignores]
# tests/host_trace_helpers_test.py：S102 是有意行为——无扩展名的 tracemiku
# 主脚本只能 exec 载入（文件内注释已说明）。
"tests/host_trace_helpers_test.py" = ["S102"]
# tools/ 两个脚本本次任务范围外，存量风格待其归属改动统一清理：
# spawn_hook 是交互式运行脚本；vm_replay_plan_eval 的 exec 是
# --verify-emitted-python 交叉验证的核心机制（生成代码必须真实执行）。
"tools/spawn_hook.py" = ["EXE001", "I001", "SIM115"]
"tools/vm_replay_plan_eval.py" = ["EXE001", "S102"]

[project.urls]
Homepage = "https://github.com/ltlly/traceMiku"

[tool.setuptools]
# This Python project is dependency/runtime glue for the top-level wrapper.
# Runtime analysis and the web UI live in Rust crates plus frontend/.
py-modules = []

# pytest config lives in pytest.ini (pytest reads that first; pyproject.toml
# duplication would be ignored).
