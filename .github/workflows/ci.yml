name: ci

# 默认关闭：仅支持手动触发（workflow_dispatch）。
# 需要 CI 自动生效时，把下面两个事件移回：
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt + clippy + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: fmt check
        run: cargo fmt --check
      - name: clippy (lib, -D warnings)
        run: cargo clippy --workspace --lib -- -D warnings
      - name: test core
        run: cargo test -p tracemiku-core
      - name: test cli
        run: cargo test -p tracemiku-cli
      - name: command coverage
        run: cargo build -p tracemiku-cli --bin tracemiku-cli && python3 ../scripts/contract_audit.py

  tracer:
    name: tracer (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tracer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types tests/record_contract_test.ts
      - run: node --experimental-strip-types tests/external_writes_contract_test.ts
      - run: node --experimental-strip-types tests/plugins_transport_test.ts
      - run: node --experimental-strip-types tests/agent_lifecycle_test.ts

  host:
    name: host (offline capture flow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra test
      - run: make py-compile host-tests
