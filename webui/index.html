<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>traceMiku web</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header id="topbar">
  <span class="brand">traceMiku <span class="dim">web</span></span>
  <span id="meta" class="meta">loading…</span>
  <span class="grow"></span>
  <label class="toggle">
    <input type="checkbox" id="sync-toggle" checked>
    <span>同步 (sync trace ↔ CFG)</span>
  </label>
  <span class="hint">j/k 单步 · g/G 头尾 · / 搜索 · :N 跳转</span>
  <button class="help-btn" data-help="overview" title="帮助 (整体说明)">?</button>
</header>

<!-- 帮助 popover (全局, 默认隐藏) -->
<div id="help-popover" class="hidden" role="dialog" aria-modal="true">
  <div id="help-popover-content"></div>
</div>

<main id="layout">
  <!-- 左侧 vertical tab strip — 旋转文字显示全名. title=完整说明 -->
  <aside id="left-tabs">
    <button class="vtab active" data-vtab="funcs"   title="函数列表 — 列出 trace 中出现的所有函数, click 切到该函数 CFG">Functions</button>
    <button class="vtab"        data-vtab="back"    title="调用栈 — 当前 cursor 处的 call stack: 每帧是一次 bl/blr 还未 ret, 最上面是最深层 callee. click 跳到调用点">Backtrace</button>
    <button class="vtab"        data-vtab="calltree" title="Call Tree — 整 trace 的嵌套调用树 (从 bl/ret 配对建栈). click 跳到 enter idx">Call Tree</button>
    <button class="vtab"        data-vtab="forks"   title="Forks — agent 抓到的 fork/clone 事件: parent_pc, child_pid, syscall, attach_status, runtime. 用 --enable-fork-hook 采集. P1-C">Forks</button>
    <button class="vtab"        data-vtab="strings" title="字符串 — 当前 cursor 内存中可见的 ASCII 字符串. 双击查看 provenance (谁逐字节写, 谁读)">Strings</button>
    <button class="vtab"        data-vtab="taint"   title="污点追踪 — 从 cursor 处的某寄存器开始, forward 看后续被污染的指令, backward 找该值的来源">Taint</button>
    <button class="vtab"        data-vtab="xref"    title="交叉引用 — 当前 cursor 的 PC 在 trace 中所有被执行的位置 (= PC 执行历史)">Cross Ref</button>
    <button class="vtab"        data-vtab="sofilter" title="SO Filter — multi-SO trace 时按 SO 折叠 / 显示. checkbox 关掉的 SO 在 trace 流里折叠为 [N records] 占位符">SO Filter</button>
    <button class="vtab"        data-vtab="settings" title="设置: 限制条数, 地址显示格式">Settings</button>
  </aside>

  <!-- 左侧 panel content (随 vtab 切换). 各子 panel 永久保留, 切换只 show/hide -->
  <section id="left-panel">
    <div class="panelhead">
      <span id="left-panel-title">Functions</span>
      <span class="grow"></span>
      <span id="left-panel-info" class="dim"></span>
      <button class="help-btn" data-help="left-panel" title="帮助">?</button>
    </div>
    <div id="left-panel-body">
      <div class="lp-tab active" data-tab="funcs"   id="lp-funcs"></div>
      <div class="lp-tab"        data-tab="back"    id="lp-back"></div>
      <div class="lp-tab"        data-tab="calltree" id="lp-calltree"></div>
      <div class="lp-tab"        data-tab="forks"   id="lp-forks"></div>
      <div class="lp-tab"        data-tab="strings" id="lp-strings"></div>
      <div class="lp-tab"        data-tab="taint"   id="lp-taint"></div>
      <div class="lp-tab"        data-tab="xref"    id="lp-xref"></div>
      <div class="lp-tab"        data-tab="sofilter" id="lp-sofilter"></div>
      <div class="lp-tab"        data-tab="settings" id="lp-settings"></div>
    </div>
  </section>

  <!-- 中央: 汇编流 + 下方 memory tab -->
  <section id="asm-col">
    <div class="panelhead">
      <span>Disassembly <span id="trace-info" class="dim"></span></span>
      <span class="grow"></span>
      <span id="status" class="dim"></span>
      <button class="help-btn" data-help="disasm" title="帮助">?</button>
    </div>
    <div id="stream-header">
      <span class="hd ec-spacer"></span>
      <span class="hd hd-idx">idx<span class="col-resize" data-col="idx"></span></span>
      <span class="hd hd-pc">pc<span class="col-resize" data-col="pc"></span></span>
      <span class="hd hd-func">func<span class="col-resize" data-col="func"></span></span>
      <span class="hd hd-asm">asm</span>
    </div>
    <div id="stream"></div>
    <div id="bottom-tabs">
      <button class="btab active" data-btab="memory">Memory</button>
      <button class="btab"        data-btab="calltree">Call Tree</button>
      <button class="btab"        data-btab="navigation">Navigation</button>
      <button class="btab"        data-btab="trace-for-pc">Trace for PC</button>
      <span class="grow"></span>
      <button class="help-btn" data-help="bottom" title="帮助">?</button>
    </div>
    <div id="bottom-content">
      <div class="bbody active" id="b-memory"></div>
      <div class="bbody" id="b-calltree"><div class="dim">call tree pending</div></div>
      <div class="bbody" id="b-navigation"><div class="dim">navigation history pending</div></div>
      <div class="bbody" id="b-trace-for-pc"><div class="dim">click 任意 CFG 中的 ASM 行, 或 trace 中的指令, 这里会显示该 PC 的所有执行 idx (按 cursor 分前后)</div></div>
    </div>
  </section>

  <!-- 右侧: CFG 图 / Registers (vertical tab) -->
  <section id="right-col">
    <div class="panelhead">
      <span id="right-tab-title">Graph</span>
      <span class="grow"></span>
      <select id="cfg-source" class="inp" style="font-size:11px" title="CFG 数据源">
        <option value="trace">Trace CFG</option>
        <option value="bn-asm">BN ASM (full + overlay)</option>
      </select>
      <select id="cfg-func-select" class="inp" style="font-size:11px;max-width:240px"></select>
      <button id="btn-fit" class="btn">fit</button>
      <button id="btn-reload-cfg" class="btn">reload</button>
      <span id="cfg-info" class="dim"></span>
      <button class="help-btn" data-help="right" title="帮助">?</button>
    </div>
    <div id="right-body">
      <div id="cfg-pane" class="rbody active">
        <div id="cfg-canvas-wrap">
          <div id="cfg-canvas"></div>
        </div>
      </div>
      <div id="regs-pane" class="rbody"></div>
      <div id="hlil-pane" class="rbody"></div>
    </div>
  </section>

  <!-- 右侧最外层 vertical tabs -->
  <aside id="right-tabs">
    <button class="vtab active" data-rtab="cfg"  title="Graph (CFG) — trace 重建的 BB 控制流">Graph</button>
    <button class="vtab"        data-rtab="regs" title="Registers — 当前 cursor 寄存器值 + 智能解引用">Registers</button>
    <button class="vtab"        data-rtab="hlil" title="HLIL — 反编译伪代码 (BN/Ghidra/IDA 后端, cursor 联动)">HLIL</button>
  </aside>

  <footer id="cmdbar">
    <span id="cmd-prompt"></span>
    <input id="cmd-input" type="text" placeholder="" class="inp">
  </footer>
</main>

<script type="module" src="/static/app.js"></script>
</body>
</html>
